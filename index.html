<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экзамен-Тренажёр</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="brand-mark" aria-label="Логотип">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path
              d="M12 22.5L32 12l20 10.5v19L32 52 12 41.5v-19zm20-8.5L18 22l14 7.3L46 22l-14-8zm-16.5 11.6l13.5 7 13.5-7v12.8l-13.5 7-13.5-7V25.6z"
              fill="white" />
          </svg>
        </div>
        <span>Экзамен-Тренажёр</span>
      </div>
      <div class="spacer"></div>
      <div class="crumb" id="crumb"></div>
      <button class="icon-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему"><i
          class="bi bi-moon-stars-fill"></i></button>
    </div>
  </header>

  <div class="wrap" id="app"></div>

  <script type="module" src="js/app.js"></script>

</body>

</html>
